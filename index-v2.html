<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f7ff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Nhịp Sống"><title>Nhịp Sống</title><style>
:root{--ink:#1b1930;--muted:#77748b;--line:#e6e3ee;--h:76px}*{box-sizing:border-box}body{margin:0;background:#f4f2ff;color:var(--ink);font:16px Arial,sans-serif}.app{max-width:620px;min-height:100dvh;margin:auto;padding:calc(24px + env(safe-area-inset-top)) 20px calc(100px + env(safe-area-inset-bottom));background:#fbfaff}header,.day,.health{display:flex;align-items:center;justify-content:space-between}.eyebrow{margin:0;color:#746d9d;font-size:11px;font-weight:bold;letter-spacing:1.2px}h1{margin:4px 0;font-size:30px}h2{margin:7px 0 12px}.avatar,.day button{border:0;background:#e2ddff;color:#484173;font-weight:bold}.avatar{width:40px;height:40px;border-radius:50%}.day{margin:28px 0 18px;padding:11px;border:1px solid var(--line);border-radius:18px;background:#fff}.day button{width:40px;height:40px;border-radius:12px;font-size:27px}.day div{text-align:center;display:grid;gap:3px}.day span,.card span,.card small,.health p,.items span{color:var(--muted);font-size:14px}.timeline{position:relative;height:1368px;border-left:2px solid #ddd8ef}.hour{position:absolute;left:0;width:100%;border-top:1px solid var(--line)}.hour time{position:absolute;right:calc(100% + 10px);top:-8px;color:var(--muted);font-size:12px}.event{position:absolute;left:15px;width:calc(100% - 15px);min-height:58px;padding:0;border:0;border-left:5px solid var(--c);border-radius:13px;background:#fff;text-align:left;box-shadow:0 3px 13px #2c215712;overflow:hidden;cursor:pointer;transition:transform .18s}.event:active{transform:scale(.985)}.card{height:100%;display:grid;align-content:center;gap:5px;padding:12px 14px}.card small{font-weight:bold}.health{gap:12px;margin-top:28px;padding:18px;border-radius:18px;background:#eeeaff}.health h2{margin:4px 0;font-size:18px}.health p{margin:0}.secondary,.primary,.minor{border:0;border-radius:12px;padding:12px 14px;font-weight:bold;cursor:pointer}.secondary{background:#fff;color:#4f4880}.primary{width:100%;margin-top:14px;background:#4f48bd;color:#fff}.minor{width:100%;margin-top:10px;background:#eeebff;color:#4f48bd}.add{position:fixed;z-index:1;bottom:calc(24px + env(safe-area-inset-bottom));left:calc(50% + min(290px, 50vw - 20px));width:56px;height:56px;border:0;border-radius:50%;transform:translateX(-100%);background:#4f48bd;color:#fff;font-size:34px;box-shadow:0 7px 20px #4f48bd66}.overlay{position:fixed;z-index:5;inset:0;display:flex;align-items:end;background:#19162900;animation:fade .2s forwards}.sheet{width:100%;max-width:620px;max-height:88dvh;margin:auto;overflow:auto;padding:25px 20px calc(25px + env(safe-area-inset-bottom));border-radius:25px 25px 0 0;background:#fff;transform:translateY(100%);animation:slide .28s cubic-bezier(.2,.8,.2,1) forwards}.close{float:right;border:0;border-radius:10px;padding:8px 11px;background:#f0eeff;color:#4f48bd;font-weight:bold}.description{clear:both;color:var(--muted)}.items{list-style:none;margin:0;padding:0;display:grid;gap:9px}.items li{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:#f8f7fc}.items li div{display:grid;gap:4px}.check{width:28px;height:28px;border:2px solid #bcb7d2;border-radius:50%;background:#fff}.check.done{border-color:#4f48bd;background:#4f48bd;color:#fff}form{clear:both;padding-top:12px}label{display:grid;gap:7px;margin:15px 0;color:#47415d;font-size:14px;font-weight:bold}input,textarea{width:100%;border:1px solid #ddd9e8;border-radius:11px;padding:12px;font:inherit}textarea{min-height:80px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toast{position:fixed;bottom:92px;left:50%;z-index:8;margin:0;padding:10px 15px;border-radius:20px;transform:translateX(-50%);background:#28243c;color:#fff;font-size:14px;white-space:nowrap;animation:pop .2s}@keyframes fade{to{background:#19162966}}@keyframes slide{to{transform:translateY(0)}}@keyframes pop{from{opacity:0;transform:translate(-50%,12px)}to{opacity:1;transform:translate(-50%,0)}}
</style></head><body><main class="app"><header><div><p class="eyebrow">NHỊP SỐNG</p><h1>Lịch của bạn</h1></div><button class="avatar">T</button></header><section class="day" id="day"><button onclick="moveDay(-1)">‹</button><div><strong id="dayText"></strong><span id="yearText"></span></div><button onclick="moveDay(1)">›</button></section><section class="timeline" id="timeline"></section><section class="health"><div><p class="eyebrow">SỨC KHỎE</p><h2>Hôm nay bạn thế nào?</h2><p>Theo dõi giấc ngủ, cardio và buổi tập.</p></div><button class="secondary" onclick="openHealth()">Ghi lại</button></section><button class="add" onclick="openAdd()">+</button></main><script>
const sample=[{id:1,title:'Học trên lớp',start:'07:00',end:'11:30',color:'#4f7cff',description:'Buổi học sáng',type:'study',items:[{id:11,title:'Toán',detail:'07:00 · Chương hàm số',done:false},{id:12,title:'Tiếng Anh',detail:'08:45 · Bài đọc hiểu',done:false}]},{id:2,title:'Tập Gym',start:'17:30',end:'19:00',color:'#ec6272',description:'Upper body',type:'gym',items:[{id:21,title:'Bench press',detail:'4 × 8 · 40 kg',done:true},{id:22,title:'Lat pulldown',detail:'3 × 12 · 35 kg',done:false}]},{id:3,title:'Đi ngủ',start:'22:30',end:'23:59',color:'#8267c7',description:'Mục tiêu ngủ 8 tiếng',type:'sleep',items:[]}];let events=JSON.parse(localStorage.getItem('nhip-events')||'null')||sample,date=new Date(),touchStart=null;const px=76,mins=t=>{let[a,b]=t.split(':').map(Number);return a*60+b},save=()=>localStorage.setItem('nhip-events',JSON.stringify(events)),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function render(){document.getElementById('dayText').textContent=new Intl.DateTimeFormat('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit'}).format(date);document.getElementById('yearText').textContent=date.getFullYear();let hours='';for(let h=6;h<=24;h+=2)hours+=`<div class="hour" style="top:${(h-6)*px}px"><time>${String(h===24?0:h).padStart(2,'0')}:00</time></div>`;let cards=events.map(e=>{let top=Math.max(0,(mins(e.start)-360)/60*px),height=Math.max(58,(mins(e.end)-mins(e.start))/60*px-5);return `<button class="event" style="--c:${e.color};top:${top}px;height:${height}px" onclick="detail(${e.id})"><div class="card"><strong>${esc(e.title)}</strong><span>${e.start} – ${e.end} · ${esc(e.description||'Không có mô tả')}</span>${e.items.length?`<small>${e.items.filter(i=>i.done).length}/${e.items.length} mục hoàn thành</small>`:''}</div></button>`}).join('');document.getElementById('timeline').innerHTML=hours+cards}
function moveDay(n){date.setDate(date.getDate()+n);render()}function appClose(){document.getElementById('overlay')?.remove()}function overlay(html){appClose();document.body.insertAdjacentHTML('beforeend',`<div class="overlay" id="overlay"><section class="sheet">${html}</section></div>`)}
function detail(id){let e=events.find(x=>x.id===id),name=e.type==='gym'?'Bài tập':e.type==='study'?'Thời khóa biểu':'Việc cần làm';overlay(`<button class="close" onclick="appClose()">Đóng</button><p class="eyebrow">${e.start} – ${e.end}</p><h2>${esc(e.title)}</h2><p class="description">${esc(e.description)}</p><h3>${name}</h3>${e.items.length?`<ul class="items">${e.items.map(i=>`<li><button class="check ${i.done?'done':''}" onclick="toggle(${e.id},${i.id})">${i.done?'✓':''}</button><div><strong>${esc(i.title)}</strong><span>${esc(i.detail)}</span></div></li>`).join('')}</ul>`:'<p class="description">Chưa có mục chi tiết.</p>'}<button class="minor" onclick="openItem(${e.id})">+ Thêm mục vào lịch này</button>`)}
function toggle(eid,iid){let i=events.find(e=>e.id===eid).items.find(i=>i.id===iid);i.done=!i.done;save();detail(eid);render()}function openItem(id){overlay(`<button class="close" onclick="detail(${id})">Quay lại</button><h2>Thêm lịch nhỏ</h2><form onsubmit="addItem(event,${id})"><label>Tên môn học, bài tập hoặc việc cần làm<input name="title" required placeholder="Ví dụ: Squat"></label><label>Chi tiết<textarea name="detail" placeholder="Ví dụ: 3 × 10 · 50 kg"></textarea></label><button class="primary">Thêm vào lịch</button></form>`)}function addItem(ev,id){ev.preventDefault();let f=new FormData(ev.target),e=events.find(e=>e.id===id);e.items.push({id:Date.now(),title:f.get('title'),detail:f.get('detail'),done:false});save();detail(id);render();toast('Đã thêm lịch nhỏ')}
function openAdd(){overlay(`<button class="close" onclick="appClose()">Hủy</button><h2>Thêm lịch mới</h2><form onsubmit="add(event)"><label>Tên sự kiện<input name="title" required placeholder="Ví dụ: Tự học"></label><div class="two"><label>Bắt đầu<input name="start" type="time" value="09:00" required></label><label>Kết thúc<input name="end" type="time" value="10:00" required></label></div><label>Màu sắc<input name="color" type="color" value="#4f7cff"></label><label>Mô tả<textarea name="description" placeholder="Ghi chú ngắn"></textarea></label><button class="primary">Thêm vào lịch</button></form>`)}function add(ev){ev.preventDefault();let f=new FormData(ev.target);events.push({id:Date.now(),title:f.get('title'),start:f.get('start'),end:f.get('end'),color:f.get('color'),description:f.get('description'),type:'personal',items:[]});save();appClose();render();toast('Đã thêm vào lịch')}
function openHealth(){let h=JSON.parse(localStorage.getItem('nhip-health')||'{}');overlay(`<button class="close" onclick="appClose()">Hủy</button><h2>Nhật ký sức khỏe</h2><form onsubmit="healthSave(event)"><div class="two"><label>Giấc ngủ (giờ)<input name="sleep" type="number" value="${h.sleep||''}"></label><label>Cardio (phút)<input name="cardio" type="number" value="${h.cardio||''}"></label></div><label>Số bước<input name="steps" type="number" value="${h.steps||''}"></label><label>Ghi chú<textarea name="note">${esc(h.note||'')}</textarea></label><button class="primary">Lưu nhật ký</button></form>`)}function healthSave(ev){ev.preventDefault();localStorage.setItem('nhip-health',JSON.stringify(Object.fromEntries(new FormData(ev.target))));appClose();toast('Đã lưu nhật ký sức khỏe')}
function toast(t){document.querySelector('.toast')?.remove();document.body.insertAdjacentHTML('beforeend',`<p class="toast">${t}</p>`);setTimeout(()=>document.querySelector('.toast')?.remove(),2200)}const dayArea=document.getElementById('day');dayArea.addEventListener('touchstart',e=>touchStart=e.touches[0].clientX);dayArea.addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-touchStart;if(Math.abs(d)>50)moveDay(d<0?1:-1)});render();
</script></body></html>

<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nhịp Sống</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f2ff;color:#1b1930;font:16px Arial,sans-serif}.app{max-width:620px;min-height:100vh;margin:auto;padding:25px 20px 100px;background:#fbfaff}header,.day,.health{display:flex;align-items:center;justify-content:space-between}.eyebrow{color:#756e9c;font-size:11px;font-weight:bold;letter-spacing:1px;margin:0}h1{margin:5px 0;font-size:30px}h2{margin:5px 0 12px}.avatar,.day button{border:0;background:#e2ddff;color:#484173;font-weight:bold}.avatar{width:42px;height:42px;border-radius:50%;cursor:pointer}.day{margin:25px 0 18px;padding:10px;border:1px solid #e6e3ee;border-radius:18px;background:white}.day button{width:40px;height:40px;border-radius:12px;font-size:27px}.day div{text-align:center;display:grid;gap:3px}.muted,.card span,.card small,.health p,.items span{color:#77748b;font-size:14px}.timeline{position:relative;height:1368px;border-left:2px solid #ddd8ef}.hour{position:absolute;left:0;width:100%;border-top:1px solid #e6e3ee}.hour time{position:absolute;right:calc(100% + 10px);top:-8px;color:#77748b;font-size:12px}.event{position:absolute;left:15px;width:calc(100% - 15px);min-height:58px;padding:0;border:0;border-left:5px solid var(--c);border-radius:13px;background:white;text-align:left;box-shadow:0 3px 13px #2c215712;overflow:hidden;cursor:pointer}.card{height:100%;display:grid;align-content:center;gap:5px;padding:12px 14px}.card small{font-weight:bold}.health{gap:10px;margin-top:25px;padding:18px;border-radius:18px;background:#eeeaff}.health h2{font-size:18px;margin:4px 0}.health p{margin:0}.primary,.secondary,.minor{border:0;border-radius:12px;padding:12px 14px;font-weight:bold;cursor:pointer}.primary{width:100%;margin-top:13px;background:#4f48bd;color:white}.secondary{background:white;color:#4f48bd}.minor{width:100%;margin-top:10px;background:#eeebff;color:#4f48bd}.add{position:fixed;bottom:25px;left:calc(50% + min(290px,50vw - 20px));width:56px;height:56px;transform:translateX(-100%);border:0;border-radius:50%;background:#4f48bd;color:#fff;font-size:34px;box-shadow:0 7px 20px #4f48bd66;cursor:pointer}.overlay{position:fixed;z-index:5;inset:0;display:flex;align-items:end;background:#19162900;animation:fade .2s forwards}.sheet{width:100%;max-width:620px;max-height:88vh;margin:auto;overflow:auto;padding:25px 20px;border-radius:25px 25px 0 0;background:white;transform:translateY(100%);animation:slide .25s forwards}.auth{align-items:center;background:#f4f2ff}.auth .sheet{max-width:420px;border-radius:25px;transform:none;animation:pop .25s}.close{float:right;border:0;border-radius:10px;padding:8px 11px;background:#f0eeff;color:#4f48bd;font-weight:bold;cursor:pointer}.description{clear:both;color:#77748b}.items{list-style:none;margin:0;padding:0;display:grid;gap:9px}.items li{display:flex;gap:12px;align-items:center;padding:12px;border-radius:12px;background:#f8f7fc}.items li div{display:grid;gap:4px}.check{width:28px;height:28px;border:2px solid #bcb7d2;border-radius:50%;background:white;cursor:pointer}.check.done{border-color:#4f48bd;background:#4f48bd;color:#fff}form{clear:both;padding-top:10px}label{display:grid;gap:7px;margin:14px 0;color:#47415d;font-size:14px;font-weight:bold}input,textarea{width:100%;border:1px solid #ddd9e8;border-radius:11px;padding:12px;font:inherit}textarea{min-height:75px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.toast{position:fixed;z-index:8;bottom:92px;left:50%;margin:0;padding:10px 15px;border-radius:20px;transform:translateX(-50%);background:#28243c;color:#fff;font-size:14px;white-space:nowrap}.link{margin-top:15px;text-align:center;color:#4f48bd;cursor:pointer}@keyframes fade{to{background:#19162966}}@keyframes slide{to{transform:translateY(0)}}@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
</style></head><body><main class="app"><header><div><p class="eyebrow">NHỊP SỐNG</p><h1>Lịch của bạn</h1></div><button class="avatar" onclick="showAccount()" id="avatar">?</button></header><section class="day" id="day"><button onclick="moveDay(-1)">‹</button><div><strong id="dayText"></strong><span class="muted" id="yearText"></span></div><button onclick="moveDay(1)">›</button></section><section class="timeline" id="timeline"></section><section class="health"><div><p class="eyebrow">SỨC KHỎE</p><h2>Hôm nay bạn thế nào?</h2><p>Theo dõi giấc ngủ, cardio và buổi tập.</p></div><button class="secondary" onclick="openHealth()">Ghi lại</button></section><button class="add" onclick="openAdd()">+</button></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
// DÁN 2 GIÁ TRỊ BẠN ĐÃ COPY VÀO GIỮA DẤU NHÁY ĐƠN:
const SUPABASE_URL='https://oinidvpcsvjizxwdllxn.supabase.co';
const SUPABASE_KEY='sb_publishable_8f91fW9VjjhSwz-idf0pPQ_ms9eMhQs';
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let user=null,events=[],date=new Date(),touchStart=null;const px=76,mins=t=>{let[a,b]=t.split(':').map(Number);return a*60+b},dateText=()=>date.toISOString().slice(0,10),esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function overlay(html,auth=false){appClose();document.body.insertAdjacentHTML('beforeend',`<div class="overlay ${auth?'auth':''}" id="overlay"><section class="sheet">${html}</section></div>`)}function appClose(){document.getElementById('overlay')?.remove()}function toast(t){document.querySelector('.toast')?.remove();document.body.insertAdjacentHTML('beforeend',`<p class="toast">${t}</p>`);setTimeout(()=>document.querySelector('.toast')?.remove(),2500)}
function render(){document.getElementById('dayText').textContent=new Intl.DateTimeFormat('vi-VN',{weekday:'long',day:'2-digit',month:'2-digit'}).format(date);document.getElementById('yearText').textContent=date.getFullYear();document.getElementById('avatar').textContent=user?user.email[0].toUpperCase():'?';let h='';for(let i=6;i<=24;i+=2)h+=`<div class="hour" style="top:${(i-6)*px}px"><time>${String(i===24?0:i).padStart(2,'0')}:00</time></div>`;let c=events.map(e=>{let top=Math.max(0,(mins(e.starts_at)-360)/60*px),height=Math.max(58,(mins(e.ends_at)-mins(e.starts_at))/60*px-5);return `<button class="event" style="--c:${e.color};top:${top}px;height:${height}px" onclick="detail('${e.id}')"><div class="card"><strong>${esc(e.title)}</strong><span>${e.starts_at.slice(0,5)} – ${e.ends_at.slice(0,5)} · ${esc(e.description)}</span>${e.items?.length?`<small>${e.items.filter(i=>i.completed).length}/${e.items.length} mục hoàn thành</small>`:''}</div></button>`}).join('');document.getElementById('timeline').innerHTML=h+c}
async function load(){if(!user)return;let{data:e,error}=await sb.from('events').select('*').eq('event_date',dateText()).order('starts_at');if(error)return toast('Không tải được lịch');let{data:items}=await sb.from('event_items').select('*');events=(e||[]).map(x=>({...x,items:(items||[]).filter(i=>i.event_id===x.id)}));render()}
function moveDay(n){date.setDate(date.getDate()+n);load()}function authView(signup=false){overlay(`<h2>${signup?'Tạo tài khoản':'Đăng nhập'}</h2><p class="description">${signup?'Dữ liệu lịch của bạn sẽ đồng bộ giữa các thiết bị.':'Chào mừng bạn quay lại Nhịp Sống.'}</p><form onsubmit="${signup?'signUp(event)':'signIn(event)'}"><label>Email<input name="email" type="email" required placeholder="ban@email.com"></label><label>Mật khẩu<input name="password" type="password" required minlength="6" placeholder="Ít nhất 6 ký tự"></label><button class="primary">${signup?'Tạo tài khoản':'Đăng nhập'}</button></form><p class="link" onclick="authView(${!signup})">${signup?'Đã có tài khoản? Đăng nhập':'Chưa có tài khoản? Đăng ký'}</p>`,true)}
async function signUp(e){e.preventDefault();let f=new FormData(e.target),{error}=await sb.auth.signUp({email:f.get('email'),password:f.get('password'),options:{emailRedirectTo:location.href}});if(error)return toast(error.message);toast('Đã tạo tài khoản. Hãy kiểm tra email để xác nhận.');appClose()}async function signIn(e){e.preventDefault();let f=new FormData(e.target),{error}=await sb.auth.signInWithPassword({email:f.get('email'),password:f.get('password')});if(error)return toast('Email hoặc mật khẩu chưa đúng');appClose();await boot()}
function showAccount(){if(!user)return authView();overlay(`<button class="close" onclick="appClose()">Đóng</button><h2>${esc(user.email)}</h2><p class="description">Dữ liệu đang đồng bộ với tài khoản này.</p><button class="primary" onclick="logout()">Đăng xuất</button>`)}async function logout(){await sb.auth.signOut();user=null;events=[];appClose();render();authView()}
async function boot(){let{data:{session}}=await sb.auth.getSession();user=session?.user||null;if(!user){render();authView();return}await load()}sb.auth.onAuthStateChange(()=>setTimeout(boot,0));
function detail(id){let e=events.find(x=>x.id===id),label=e.category==='gym'?'Bài tập':e.category==='study'?'Thời khóa biểu':'Việc cần làm';overlay(`<button class="close" onclick="appClose()">Đóng</button><p class="eyebrow">${e.starts_at.slice(0,5)} – ${e.ends_at.slice(0,5)}</p><h2>${esc(e.title)}</h2><p class="description">${esc(e.description)}</p><h3>${label}</h3>${e.items.length?`<ul class="items">${e.items.map(i=>`<li><button class="check ${i.completed?'done':''}" onclick="toggle('${i.id}')">${i.completed?'✓':''}</button><div><strong>${esc(i.title)}</strong><span>${esc(i.details)}</span></div></li>`).join('')}</ul>`:'<p class="description">Chưa có mục chi tiết.</p>'}<button class="minor" onclick="openItem('${e.id}')">+ Thêm mục vào lịch này</button>`)}
async function toggle(id){let i=events.flatMap(e=>e.items).find(i=>i.id===id);await sb.from('event_items').update({completed:!i.completed}).eq('id',id);await load();detail(events.find(e=>e.items.some(i=>i.id===id)).id)}function openItem(id){overlay(`<button class="close" onclick="detail('${id}')">Quay lại</button><h2>Thêm lịch nhỏ</h2><form onsubmit="addItem(event,'${id}')"><label>Tên môn học, bài tập hoặc việc<input name="title" required></label><label>Chi tiết<textarea name="details" placeholder="Ví dụ: 3 × 10 · 50 kg"></textarea></label><button class="primary">Thêm vào lịch</button></form>`)}async function addItem(ev,id){ev.preventDefault();let f=new FormData(ev.target),{error}=await sb.from('event_items').insert({user_id:user.id,event_id:id,title:f.get('title'),details:f.get('details')});if(error)return toast(error.message);await load();detail(id)}
function openAdd(){overlay(`<button class="close" onclick="appClose()">Hủy</button><h2>Thêm lịch mới</h2><form onsubmit="add(event)"><label>Tên sự kiện<input name="title" required></label><div class="two"><label>Bắt đầu<input name="start" type="time" value="09:00" required></label><label>Kết thúc<input name="end" type="time" value="10:00" required></label></div><label>Màu sắc<input name="color" type="color" value="#4f7cff"></label><label>Mô tả<textarea name="description"></textarea></label><button class="primary">Thêm vào lịch</button></form>`)}async function add(ev){ev.preventDefault();let f=new FormData(ev.target),{error}=await sb.from('events').insert({user_id:user.id,event_date:dateText(),title:f.get('title'),starts_at:f.get('start'),ends_at:f.get('end'),color:f.get('color'),description:f.get('description')});if(error)return toast(error.message);appClose();await load();toast('Đã thêm vào lịch')}
function openHealth(){overlay(`<button class="close" onclick="appClose()">Hủy</button><h2>Nhật ký sức khỏe</h2><form onsubmit="saveHealth(event)"><div class="two"><label>Giấc ngủ (giờ)<input name="sleep_hours" type="number" step="0.1"></label><label>Cardio (phút)<input name="cardio_minutes" type="number"></label></div><label>Số bước<input name="steps" type="number"></label><label>Ghi chú<textarea name="notes"></textarea></label><button class="primary">Lưu nhật ký</button></form>`)}async function saveHealth(ev){ev.preventDefault();let f=new FormData(ev.target),{error}=await sb.from('health_logs').upsert({user_id:user.id,log_date:dateText(),sleep_hours:f.get('sleep_hours')||null,cardio_minutes:f.get('cardio_minutes')||null,steps:f.get('steps')||null,notes:f.get('notes')});if(error)return toast(error.message);appClose();toast('Đã lưu nhật ký sức khỏe')}
document.getElementById('day').addEventListener('touchstart',e=>touchStart=e.touches[0].clientX);document.getElementById('day').addEventListener('touchend',e=>{let d=e.changedTouches[0].clientX-touchStart;if(Math.abs(d)>50)moveDay(d<0?1:-1)});boot();
</script></body></html>
